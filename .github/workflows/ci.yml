name: 검증
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run typecheck
      - run: npm run study -- restore
      - run: npx tsx src/harness.ts
      - run: npx tsx src/korea_harness.ts
      - run: npx tsx src/korea_improve_harness.ts
      - run: npx tsx src/korea_improve.ts verify-public
      - run: npm run verify
